<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Animated Login</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* 1. Global Reset & Body Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* Background Gradient Animation */
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    /* 2. Login Card Container */
    .login-container {
      background: rgba(255, 255, 255, 1);
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
      
      /* Entrance Animation */
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s ease-out forwards;
    }

    /* Heading Styling */
    .login-container h2 {
      color: #333;
      font-weight: 600;
      margin-bottom: 30px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    /* 3. Input Fields Styling */
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e1e1e1;
      border-radius: 50px; /* Fully rounded corners */
      outline: none;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f9f9f9;
      color: #333;
    }

    /* Input Focus Effect (Smooth Border Color & Shadow) */
    input:focus {
      border-color: #764ba2;
      background: #fff;
      box-shadow: 0 5px 15px rgba(118, 75, 162, 0.15);
      transform: scale(1.02);
    }

    /* Placeholder styling */
    input::placeholder {
      color: #aaa;
    }

    /* 4. Button Styling */
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
      transition: all 0.3s ease;
    }

    /* Button Hover Animation */
    button:hover {
      transform: translateY(-3px); /* Moves up slightly */
      box-shadow: 0 10px 20px rgba(118, 75, 162, 0.5);
      background: linear-gradient(to right, #764ba2, #667eea); /* Gradient shift */
    }

    button:active {
      transform: scale(0.98); /* Click effect */
    }

    /* 5. Signup Link Styling */
    a {
      display: block;
      margin-top: 20px;
      text-decoration: none;
      color: #666;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    /* 6. Keyframes for Entrance Animation */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>
<body>

  <div class="login-container">
    <form method="post">
      <h2>Welcome Back</h2>
      
      <div class="input-group">
        <input name="username" type="text" placeholder="Username" required>
      </div>
      
      <div class="input-group">
        <input name="password" type="password" placeholder="Password" required>
      </div>
      
      <button type="submit">Login</button>
      
      <a href="/signup">Don't have an account? <strong>Signup</strong></a>
    </form>
  </div>

</body>
</html>
