<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Analysis Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- Import Chess.js for robust logic -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
  /* --- 1. Global Settings & Background --- */
  body {
    background: radial-gradient(circle at center, #1b2030 0%, #0e0e15 100%);
    color: white;
    text-align: center;
    font-family: 'Roboto', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding-bottom: 50px;
  }

  h2 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    animation: slideDown 0.8s ease-out;
    color: #e0e6ed;
  }

  /* --- 2. Modals --- */
  .modal {
    width: 90%;
    max-width: 450px;
    background: rgba(30, 40, 60, 0.95);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    position: absolute;
    z-index: 50;
    transition: all 0.3s ease;
  }

  .modal h3 { color: #fff; margin-top: 0; font-size: 1.8rem; margin-bottom: 10px; }
  .modal p { color: #ccc; line-height: 1.6; margin-bottom: 20px; }
  .modal ul { text-align: left; padding-left: 20px; color: #bbb; margin-bottom: 25px; }

  #gameOverModal { display: none; transform: scale(0.9); opacity: 0; }
  #gameOverModal.show { display: block; transform: scale(1); opacity: 1; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  
  .win-text { color: #4ade80; }
  .lose-text { color: #f87171; }
  .draw-text { color: #fbbf24; }

  /* Inputs */
  textarea {
    width: 100%; padding: 12px; background: #20253a;
    border: 1px solid #4b7399; border-radius: 8px; color: white;
    font-family: 'Roboto', sans-serif; font-size: 1rem; outline: none; box-sizing: border-box;
    resize: vertical;
  }
  textarea:focus { border-color: #f5f682; }

  /* --- 3. Layout --- */
  .main-layout {
    display: flex; align-items: flex-start; justify-content: center;
    gap: 15px; margin: 20px auto;
  }

  /* Evaluation Bar */
  .eval-container {
    width: 30px; height: 480px;
    background: #444; border-radius: 4px;
    overflow: hidden; position: relative;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
  }

  .eval-fill {
    width: 100%; height: 50%; background: #f2f4f7;
    position: absolute; bottom: 0; left: 0; transition: height 0.5s ease-out;
  }

  .eval-text {
    position: absolute; width: 100%; text-align: center;
    font-size: 11px; font-weight: bold; color: #333; z-index: 2; top: 5px;
  }
  .eval-text.white-side { top: auto; bottom: 5px; color: #333; }
  .eval-text.black-side { color: #fff; }

  /* --- 4. The Chess Board --- */
  #chessboard {
    width: 480px; height: 480px;
    display: none; grid-template-columns: repeat(8, 1fr);
    /* Allow symbols to pop out of the squares */
    overflow: visible; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: boardFadeIn 0.8s ease-out forwards;
    position: relative;
    /* We need margin if overflow is visible so symbols don't hit edge of screen */
    margin: 20px; 
  }

  /* SVG Overlay */
  #arrowOverlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }

  /* Move Symbols (Floating "Full Circle" Style) */
  .move-symbol {
    position: absolute;
    top: -12px; right: -12px; /* Hangs off the corner */
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Roboto', sans-serif;
    font-weight: 900; /* Extra Bold */
    font-size: 15px; 
    color: #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    z-index: 30;
    border: 3px solid #fff; /* Thick white border for pop */
    animation: popSymbol 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Colors matching standard analysis */
  .symbol-brilliant { background: #1baca6; }   /* Teal !! */
  .symbol-great { background: #5c8bb0; }       /* Blue ! */
  .symbol-best { background: #81b64c; }        /* Green Star */
  .symbol-excellent { background: #96bc4b; }   /* Light Green Check */
  .symbol-book { background: #d5a47d; }        /* Brown Book */
  .symbol-inaccuracy { background: #f7c631; color: #2a2a2a; } /* Yellow ?! (Dark Text) */
  .symbol-mistake { background: #ffa459; }     /* Orange ? */
  .symbol-blunder { background: #fa412d; }     /* Red ?? */
  .symbol-forced { background: #888; }         /* Gray Box */

  /* --- 5. Squares --- */
  .square {
    width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    font-size: 42px; user-select: none;
    z-index: 1; 
  }
  
  /* Manual Border Radius for Corners (Since overflow is visible) */
  .square:nth-child(1) { border-top-left-radius: 12px; }
  .square:nth-child(8) { border-top-right-radius: 12px; }
  .square:nth-child(57) { border-bottom-left-radius: 12px; }
  .square:nth-child(64) { border-bottom-right-radius: 12px; }

  .white { background-color: #f2f4f7; color: #6390b5; }
  .black { background-color: #6390b5; color: #f2f4f7; }

  .coord {
    position: absolute; font-size: 10px; font-weight: bold;
    pointer-events: none; opacity: 0.8; font-family: sans-serif;
  }
  .coord-rank { top: 2px; left: 3px; }
  .coord-file { bottom: 2px; right: 3px; }
  .white .coord { color: #6390b5; }
  .black .coord { color: #f2f4f7; }

  /* --- 6. Pieces --- */
  .piece-anim {
    display: inline-block; animation: piecePop 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.275); z-index: 5;
  }
  .piece-white { color: #ffffff !important; filter: drop-shadow(0 0 1px #000) drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .piece-black { color: #000000 !important; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }

  /* --- 7. Interaction --- */
  .selected { background-color: #f5f682 !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
  
  .highlight { position: relative; }
  .highlight::after {
    content: ''; position: absolute; width: 18px; height: 18px;
    background: rgba(0, 0, 0, 0.15); border-radius: 50%;
  }
  .black.highlight::after { background: rgba(0, 0, 0, 0.25); }
  .highlight.capture::after {
    background: transparent; width: 54px; height: 54px;
    border: 5px solid rgba(0, 0, 0, 0.15); border-radius: 50%;
  }
  .in-check { background: radial-gradient(circle, #ff6b6b 0%, transparent 80%) !important; }

  /* --- 8. UI Elements --- */
  button {
    padding: 10px 20px; font-size: 14px; font-weight: bold;
    color: white; background: #4b7399; border: none; border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 0 #2a405e; transition: transform 0.1s, background 0.2s; margin: 0;
  }
  button:hover { background: #557ebf; transform: translateY(-2px); }
  button:active { transform: translateY(0); box-shadow: none; }
  
  .secondary-btn { background: #334155; box-shadow: 0 4px 0 #1e293b; }
  .secondary-btn:hover { background: #475569; }
  .analysis-btn { background: #8e44ad; box-shadow: 0 4px 0 #5b2c6f; }
  .analysis-btn:hover { background: #9b59b6; }
  .flip-btn { background: #e67e22; box-shadow: 0 4px 0 #a05716; }
  .flip-btn:hover { background: #d35400; }
  .reset-btn { background: #c0392b; box-shadow: 0 4px 0 #922b21; font-size: 12px; padding: 6px 12px; }
  .reset-btn:hover { background: #e74c3c; }

  #turn {
    background: rgba(255,255,255,0.05); padding: 10px 30px;
    border-radius: 50px; font-weight: bold; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); font-size: 1.2rem;
  }
  .back-btn { background: #2b3040; box-shadow: none; border: 1px solid #444; margin-top: 20px; }
  .back-btn:hover { background: #3a4050; }

  /* Analysis Panel */
  #analysisPanel {
    width: 90%; max-width: 480px; background: rgba(20, 25, 40, 0.8);
    border: 1px solid #4b7399; border-radius: 12px; padding: 20px;
    margin-top: 20px; text-align: left; display: none; box-sizing: border-box;
  }
  .toggle-container {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
  }
  
  .input-container {
    display: flex; flex-direction: column; gap: 10px;
  }
  
  .btn-row { display: flex; gap:10px; justify-content: space-between; margin-top:10px; }
  
  /* Toggle Switch */
  .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: #4ade80; }
  input:checked + .slider:before { transform: translateX(22px); }

  @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes boardFadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes piecePop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes popSymbol { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Mobile */
  @media (max-width: 540px) {
    #chessboard { width: 320px; height: 320px; }
    #arrowOverlay { width: 320px; height: 320px; }
    .square { width: 40px; height: 40px; font-size: 26px; }
    .eval-container { height: 320px; }
  }
</style>
</head>

<body>

<h2>♞ Analysis Studio</h2>

<!-- START MODAL -->
<div id="rulesBox" class="modal">
  <h3>Studio Mode</h3>
  <ul>
  <li><strong>Smart Import:</strong> Paste PGN or FEN directly.</li>
  <li><strong>History:</strong> PGN rewinds to start. FEN is a snapshot.</li>
  <li><strong>Engine:</strong> Stockfish 10 (Deep Analysis).</li>
  </ul>
  <div style="margin-top:20px;"><button onclick="startGame()">Open Studio</button></div>
</div>

<!-- GAME OVER MODAL -->
<div id="gameOverModal" class="modal">
  <h3 id="winnerText">Game Over</h3>
  <p id="gameResultReason">Checkmate</p>
  <div style="margin-top:20px;">
    <button onclick="restartGame()">Reset Board</button>
    <button class="secondary-btn" onclick="exitToDashboard()">Exit</button>
  </div>
</div>

<p id="turn" style="display:none">Status: <span style="color:#f2f4f7">White to Move</span></p>

<!-- MAIN LAYOUT -->
<div class="main-layout">
  <div class="eval-container" id="evalContainer" style="display:none;">
      <div class="eval-fill" id="evalFill"></div>
      <div class="eval-text" id="evalScore">0.0</div>
  </div>
  <div style="position:relative">
    <div id="chessboard">
      <!-- Generated Board -->
      <svg id="arrowOverlay">
          <defs>
              <marker id="arrowhead" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
                  <polygon points="0 0, 4 2, 0 4" fill="rgba(255, 107, 107, 0.9)" />
              </marker>
          </defs>
          <line id="bestMoveLine" x1="0" y1="0" x2="0" y2="0" stroke="rgba(255, 107, 107, 0.9)" stroke-width="8" marker-end="url(#arrowhead)" stroke-linecap="round" style="display:none; opacity: 0.7;" />
      </svg>
    </div>
  </div>
</div>

<!-- Analysis Panel -->
<div id="analysisPanel">
  <div class="toggle-container">
    <div style="text-align:left;">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="color:#4ade80; font-weight:bold; font-size:1.1rem;">⚡ Stockfish Analysis</span>
            <button class="reset-btn" onclick="restartGame()">Reset Board</button>
        </div>
        <div id="suggestion" style="color:#f5f682; font-size:0.9rem; margin-top:4px;">Initializing Engine...</div>
        <div id="moveQualityText" style="color:#aaa; font-size:0.85rem; margin-top:2px; height:1.2em;"></div>
    </div>
    <label class="switch"><input type="checkbox" id="analysisToggle" onchange="toggleAnalysis()" checked><span class="slider"></span></label>
  </div>
  
  
  <div class="input-container">
    <textarea id="importInput" rows="3" placeholder="Paste PGN or FEN string here..."></textarea>
    <button class="analysis-btn" onclick="smartImport()" style="width:100%;">Import Game/Position</button>
  </div>
  
  <div class="btn-row">
       <button class="analysis-btn flip-btn" onclick="flipBoard()" style="flex:1;">Flip Board ⇅</button>
       <button class="analysis-btn secondary-btn" onclick="undoMove()">❮ Undo</button>
       <button class="analysis-btn secondary-btn" onclick="redoMove()">Redo ❯</button>
  </div>
</div>

<button class="back-btn" onclick="exitToDashboard()">⬅ Exit Studio</button>

<script>
function exitToDashboard(){ window.location.reload(); }

// GLOBALS
let game = null;
let playerSide = 'w'; 
let gameActive = false;
let analysisMode = true;
let selectedSquare = null; 

let historyStack = [];
let futureStack = [];
let evaluationCache = {};
let bookCache = {}; 

let stockfish = null;
let currentBestMove = null;
let analysisDebounceTimer = null;

function startGame(){
 const rules = document.getElementById("rulesBox");
 const board = document.getElementById("chessboard");
 const evalBox = document.getElementById("evalContainer");
 const turn = document.getElementById("turn");
 const analysis = document.getElementById("analysisPanel");
 
 gameActive = true;
 analysisMode = document.getElementById("analysisToggle").checked;
 
 game = new Chess();
 historyStack = [];
 futureStack = [];
 evaluationCache = {};
 bookCache = {};

 rules.style.display = "none";
 board.style.display = "grid";
 evalBox.style.display = "block";
 turn.style.display = "block";
 analysis.style.display = "block";
 
 initStockfish();
 updateStatus();
 drawBoard();
}

function initStockfish() {
    const stockfishUrl = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js';
    try {
        const blob = new Blob([`importScripts('${stockfishUrl}');`], {type: 'application/javascript'});
        stockfish = new Worker(URL.createObjectURL(blob));
        stockfish.onmessage = function(event) {
            const line = event.data;
            if (line.includes("score")) parseScore(line);
            if(line.startsWith("bestmove")) {
                const moveData = line.split(" ");
                const moveStr = moveData[1];
                if(moveStr && moveStr !== "(none)") {
                    const from = moveStr.substring(0,2);
                    const to = moveStr.substring(2,4);
                    const promotion = moveStr.length > 4 ? moveStr.substring(4,5) : 'q';
                    currentBestMove = { from, to, promotion, san: moveStr };
                    document.getElementById("suggestion").innerText = "Best Move: " + moveStr;
                    drawArrow();
                }
            }
        };
        stockfish.postMessage("uci");
        triggerAnalysis(); 
    } catch(e) {
        console.error("Stockfish failed", e);
        document.getElementById("suggestion").innerText = "Engine Error: " + e.message;
    }
}

function parseScore(line) {
    const scoreRegex = /score (cp|mate) (-?\d+)/;
    const match = line.match(scoreRegex);
    if (match) {
        const type = match[1];
        let rawScore = parseInt(match[2]);
        const turn = game.turn();
        if (turn === 'b') rawScore = -rawScore;
        
        evaluationCache[game.fen()] = { type: type, val: rawScore };
        updateEvalBar(type, rawScore);
        classifyLastMove();
    }
}

function updateEvalBar(type, score) {
    const fill = document.getElementById("evalFill");
    const label = document.getElementById("evalScore");
    let percentage = 50;
    let text = "0.0";

    if (type === 'mate') {
        if (score > 0) { percentage = 100; text = "M" + Math.abs(score); }
        else { percentage = 0; text = "M" + Math.abs(score); }
    } else {
        text = (score / 100).toFixed(2);
        if (score > 0) text = "+" + text;
        const sigmoid = 1 / (1 + Math.exp(-score / 300));
        percentage = sigmoid * 100;
    }
    fill.style.height = `${percentage}%`;
    label.innerText = text;
    label.className = "eval-text " + (percentage > 50 ? "white-side" : "black-side");
}

async function lookupBookMove(fen, moveSan) {
    if(bookCache[fen]) return bookCache[fen].includes(moveSan);
    try {
        const encodedFen = encodeURIComponent(fen);
        const response = await fetch(`https://explorer.lichess.ovh/masters?fen=${encodedFen}`);
        const data = await response.json();
        if (data && data.moves) {
            const validMoves = data.moves.map(m => m.san);
            bookCache[fen] = validMoves;
            return validMoves.includes(moveSan);
        }
        return false;
    } catch(e) { return false; }
}

async function classifyLastMove() {
    if(historyStack.length === 0) {
        updateMoveQualityUI(null);
        return;
    }
    const prevFen = historyStack[historyStack.length - 1];
    const currFen = game.fen();
    const history = game.history();
    const lastMoveSan = history[history.length - 1];

    const isBook = await lookupBookMove(prevFen, lastMoveSan);
    if(isBook) { updateMoveQualityUI("book"); return; }

    const prevScore = evaluationCache[prevFen];
    const currScore = evaluationCache[currFen];
    if(!prevScore || !currScore) return; 

    const justMoved = (game.turn() === 'w') ? 'b' : 'w';
    let delta = 0;
    if (prevScore.type === 'mate' || currScore.type === 'mate') {
        updateMoveQualityUI(null); return; 
    }
    if (justMoved === 'w') delta = currScore.val - prevScore.val;
    else delta = prevScore.val - currScore.val;
    
    let classification = "best"; 
    const loss = -delta; 
    if (loss <= 20) classification = "best"; 
    else if (loss <= 50) classification = "excellent";
    else if (loss <= 100) classification = "good";
    else if (loss <= 200) classification = "inaccuracy"; 
    else if (loss <= 300) classification = "mistake";
    else classification = "blunder";
    
    updateMoveQualityUI(classification);
}

function updateMoveQualityUI(type) {
    const textDiv = document.getElementById("moveQualityText");
    const labelMap = {
        'brilliant': 'Brilliant Move !!', 'great': 'Great Move !', 'best': 'Best Move ★',
        'excellent': 'Excellent Move', 'good': 'Good Move', 'book': 'Book Move 📖',
        'inaccuracy': 'Inaccuracy ?!', 'mistake': 'Mistake ?', 'blunder': 'Blunder ??', 'forced': 'Forced □'
    };
    
    const existing = document.querySelector(".move-symbol");
    if(existing) {
        if(existing.parentElement) existing.parentElement.style.zIndex = "";
        existing.remove();
    }

    if(!type) { textDiv.innerText = ""; return; }
    textDiv.innerText = labelMap[type] || "";
    
    const history = game.history({verbose:true});
    if(history.length === 0) return;
    const lastMove = history[history.length - 1];
    
    const board = document.getElementById("chessboard");
    const squareDiv = [...board.children].find(div => div.dataset.square === lastMove.to);
    
    if(squareDiv) {
        const marker = document.createElement("div");
        marker.className = `move-symbol symbol-${type}`;
        let icon = "";
        if(type==='brilliant') icon="!!"; else if(type==='great') icon="!";
        else if(type==='best') icon="★"; else if(type==='excellent') icon="✓";
        else if(type==='book') icon="📖"; else if(type==='inaccuracy') icon="?!";
        else if(type==='mistake') icon="?"; else if(type==='blunder') icon="??";
        else if(type==='forced') icon="□";
        marker.innerText = icon;
        squareDiv.appendChild(marker);
        squareDiv.style.zIndex = "100"; 
    }
}

function saveState() { historyStack.push(game.fen()); futureStack = []; }

function triggerAnalysis() {
    classifyLastMove();
    if(!stockfish || !analysisMode || game.game_over()) return;
    if(analysisDebounceTimer) clearTimeout(analysisDebounceTimer);
    document.getElementById("suggestion").innerText = "Thinking...";
    hideArrow();
    analysisDebounceTimer = setTimeout(() => {
        stockfish.postMessage("position fen " + game.fen());
        stockfish.postMessage("go depth 15"); 
    }, 250); 
}

function restartGame() {
  const gameOverModal = document.getElementById("gameOverModal");
  gameOverModal.classList.remove("show");
  gameOverModal.style.display = "none";
  game = new Chess();
  historyStack = []; futureStack = []; gameActive = true; evaluationCache = {}; bookCache = {};
  updateStatus(); drawBoard(); updateEvalBar('cp', 0); updateMoveQualityUI(null); triggerAnalysis();
}

function flipBoard() {
  playerSide = (playerSide === 'w') ? 'b' : 'w';
  drawBoard();
  classifyLastMove();
}

// --- SMART IMPORT LOGIC ---
function smartImport() {
    const input = document.getElementById("importInput");
    const data = input.value.trim();
    if(!data) return;
    
    // Check if it's PGN (starts with 1. or has tags like [Event...])
    const isPGN = data.startsWith("1.") || data.startsWith("[");
    
    const temp = new Chess();
    
    if(isPGN) {
        if(!temp.load_pgn(data)) { alert("Invalid PGN format."); return; }
        
        saveState();
        // Unwind to start
        let pgnMovesStack = [];
        while (true) {
            let fen = temp.fen();
            let move = temp.undo();
            if (move) pgnMovesStack.push(fen); else break; 
        }
        futureStack = pgnMovesStack;
        game.load(temp.fen()); // Load start pos
    } else {
        // Assume FEN
        if(!temp.load(data)) { alert("Invalid FEN or PGN."); return; }
        
        saveState();
        game.load(data);
        alert("FEN Loaded. Note: FEN is a snapshot, so there is no history to 'Undo' back to the start.");
    }
    
    input.blur();
    currentBestMove = null;
    drawBoard();
    updateStatus();
    triggerAnalysis();
}

// --- MOVES ---
function undoMove() {
    if(historyStack.length === 0) return;
    futureStack.push(game.fen());
    game.load(historyStack.pop());
    currentBestMove = null; drawBoard(); updateStatus(); triggerAnalysis();
}

function redoMove() {
    // 1. History
    if(futureStack.length > 0) {
        historyStack.push(game.fen());
        game.load(futureStack.pop());
        currentBestMove = null; drawBoard(); updateStatus(); triggerAnalysis(); return;
    }
    // 2. Auto-Play Engine Move
    if(currentBestMove) {
        const moveObj = { from: currentBestMove.from, to: currentBestMove.to, promotion: currentBestMove.promotion || 'q' };
        saveState(); game.move(moveObj);
        currentBestMove = null; drawBoard(); updateStatus(); checkGameOver(); triggerAnalysis();
    }
}

// --- RENDER ---
const piecesMap = { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', P: '♟', R: '♜', N: '♞', B: '♝', Q: '♛', K: '♚' };

function drawBoard(){
 const boardDiv = document.getElementById("chessboard");
 boardDiv.querySelectorAll('.square').forEach(e => e.remove()); 
 const board = game.board(); 
 const isWhiteView = (playerSide === 'w');

 for(let r=0; r<8; r++){
  for(let c=0; c<8; c++){
   let realRow = isWhiteView ? r : 7 - r;
   let realCol = isWhiteView ? c : 7 - c;
   let sqCode = String.fromCharCode(97 + realCol) + (8 - realRow);
   let cell = board[realRow][realCol];

   let sq=document.createElement("div");
   sq.className="square "+((r+c)%2==0?"white":"black");
   sq.dataset.square = sqCode;
   
   if (c === 0) { let coord = document.createElement("span"); coord.className = "coord coord-rank"; coord.innerText = sqCode[1]; sq.appendChild(coord); }
   if (r === 7) { let coord = document.createElement("span"); coord.className = "coord coord-file"; coord.innerText = sqCode[0]; sq.appendChild(coord); }
   
   if(cell) {
     let pSpan = document.createElement("span");
     let pClass = (cell.color === 'w') ? "piece-white" : "piece-black";
     let mapKey = (cell.color === 'w') ? cell.type.toUpperCase() : cell.type.toLowerCase();
     pSpan.className = "piece-anim " + pClass;
     pSpan.textContent = piecesMap[mapKey];
     sq.appendChild(pSpan);
   }
   sq.onclick=()=>onSquareClick(sqCode);
   boardDiv.appendChild(sq);
  }
 }
 if(game.in_check()) highlightKing();
 if(analysisMode && currentBestMove) drawArrow(); else hideArrow();
 classifyLastMove();
}

function highlightKing() {
  const boardDiv = document.getElementById("chessboard");
  const board = game.board();
  const turnColor = game.turn();
  for(let r=0; r<8; r++){
    for(let c=0; c<8; c++){
      if(board[r][c] && board[r][c].type === 'k' && board[r][c].color === turnColor) {
         let kingSq = String.fromCharCode(97 + c) + (8 - r);
         let sq = boardDiv.querySelector(`[data-square="${kingSq}"]`);
         if(sq) sq.classList.add("in-check");
      }
    }
  }
}

function updateStatus(){
  let t = (game.turn() === 'w' ? "White" : "Black") + " to Move";
  let color = game.turn() === 'w' ? "#f2f4f7" : "#ff6b6b";
  const turnText = document.getElementById("turn");
  if (game.game_over()) {
      if(game.in_checkmate()) t = "Checkmate!"; else if(game.in_draw()) t = "Draw"; else t = "Game Over";
  } else if (game.in_check()) t += " (Check!)";
  turnText.innerHTML = `Status: <span style="color:${color}">${t}</span>`;
}

function onSquareClick(square){
 if(!gameActive) return;
 if(selectedSquare){
  const moveObj = { from: selectedSquare, to: square, promotion: 'q' };
  const moves = game.moves({verbose:true});
  const valid = moves.find(m => m.from === selectedSquare && m.to === square);
  
  if(valid) {
    const currentFen = game.fen();
    const prevScore = evaluationCache[currentFen];
    const isEngineMove = currentBestMove && (currentBestMove.from === selectedSquare && currentBestMove.to === square);
    saveState(); game.move(moveObj);
    if (isEngineMove && prevScore) evaluationCache[game.fen()] = prevScore; 
    currentBestMove = null; drawBoard(); updateStatus(); checkGameOver(); triggerAnalysis();
    selectedSquare = null; return;
  }
  let piece = game.get(square);
  if(piece && piece.color === game.turn()){ highlightSquare(square); selectedSquare = square; return; }
  drawBoard(); selectedSquare = null; return;
 }
 let piece = game.get(square);
 if(piece && piece.color === game.turn()){ highlightSquare(square); selectedSquare = square; }
}

function highlightSquare(square){
 const boardDiv = document.getElementById("chessboard");
 boardDiv.querySelectorAll('.square').forEach(s=>s.classList.remove("selected", "highlight", "capture"));
 let selfDiv = boardDiv.querySelector(`[data-square="${square}"]`);
 if(selfDiv) selfDiv.classList.add("selected");
 let moves = game.moves({ square: square, verbose: true });
 moves.forEach(move => {
   let targetDiv = boardDiv.querySelector(`[data-square="${move.to}"]`);
   if(targetDiv){ targetDiv.classList.add("highlight"); if(game.get(move.to)) targetDiv.classList.add("capture"); }
 });
}

function getSquareCenter(square) {
    const file = square.charCodeAt(0) - 97; const rank = parseInt(square[1]) - 1;   
    const isWhiteView = (playerSide === 'w');
    const colIndex = isWhiteView ? file : 7 - file;
    const rowIndex = isWhiteView ? (7 - rank) : rank;
    return { x: colIndex * 60 + 30, y: rowIndex * 60 + 30 };
}

function drawArrow() {
    if(!analysisMode || !currentBestMove || game.game_over()) { hideArrow(); return; }
    const from = getSquareCenter(currentBestMove.from);
    const to = getSquareCenter(currentBestMove.to);
    const arrow = document.getElementById("bestMoveLine");
    arrow.setAttribute("x1", from.x); arrow.setAttribute("y1", from.y);
    arrow.setAttribute("x2", to.x); arrow.setAttribute("y2", to.y);
    arrow.style.display = "block";
}
function hideArrow() { document.getElementById("bestMoveLine").style.display = "none"; }

function toggleAnalysis() {
    const toggle = document.getElementById("analysisToggle");
    analysisMode = toggle.checked;
    document.getElementById("suggestion").style.opacity = analysisMode ? "1" : "0.3";
    if(analysisMode) triggerAnalysis(); else hideArrow();
}

function checkGameOver() {
  if (!game.game_over()) return false;
  const modal = document.getElementById("gameOverModal");
  const winnerText = document.getElementById("winnerText");
  const reasonText = document.getElementById("gameResultReason");
  if (game.in_checkmate()) {
      winnerText.textContent = (game.turn() === 'w' ? "Black" : "White") + " Wins!";
      reasonText.textContent = "Checkmate";
  } else if (game.in_draw()) {
    winnerText.textContent = "Draw"; reasonText.textContent = "Stalemate / Insufficient Material";
  }
  modal.classList.add("show");
  return true;
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft" || e.key === "Home") { e.preventDefault(); undoMove(); }
  else if (e.key === "ArrowRight" || e.key === "End") { e.preventDefault(); redoMove(); }
});
</script>
