<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Fi Chess Arena - Chess Puzzles</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
<!-- Import Chess.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
  :root {
    --neon-blue: #00d2ff;
    --neon-gold: #ffd700;
    --danger: #ff4b2b;
    --success: #00f260;
    --bg-dark: #0f0c29;
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--bg-dark);
    background-image: radial-gradient(circle at center, #1b1b4b 0%, #0f0c29 100%);
    color: white;
    text-align: center;
    font-family: 'Roboto', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  h2 {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 4px;
    font-size: 2.2rem;
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
    background: linear-gradient(to right, var(--neon-blue), #fff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .main-container {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    width: 100%;
    max-width: 1200px;
    padding: 20px;
  }

  .board-wrapper {
    position: relative;
    padding: 25px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 15px;
    border: 1px solid rgba(0, 210, 255, 0.2);
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }

  #chessboard {
    width: 480px;
    height: 480px;
    display: none;
    grid-template-columns: repeat(8, 1fr);
    border: 2px solid #2a2a40;
  }

  .square {
    width: 60px; height: 60px;
    font-size: 44px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; position: relative;
  }
  .white-sq { background-color: #e0e6ed; }
  .black-sq { background-color: #4b6cb7; }
  
  .piece-w { color: #ffffff; filter: drop-shadow(0 0 2px #000); transition: transform 0.2s; }
  .piece-b { color: #000000; filter: drop-shadow(0 0 2px #fff); transition: transform 0.2s; }

  .coord {
    position: absolute; font-size: 11px; font-weight: 900;
    opacity: 0.8; pointer-events: none; font-family: 'Orbitron', sans-serif;
    z-index: 10;
  }
  .rank-label { top: 2px; left: 2px; }
  .file-label { bottom: 2px; right: 2px; }
  .white-sq .coord { color: #4b6cb7; }
  .black-sq .coord { color: #e0e6ed; }

  .selected { background-color: var(--neon-gold) !important; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }
  .highlight::after {
    content: ''; position: absolute; width: 16px; height: 16px;
    background: rgba(0, 242, 96, 0.5); border-radius: 50%; box-shadow: 0 0 10px var(--success);
  }
  .highlight.capture::after {
    background: transparent; border: 4px solid var(--danger); width: 42px; height: 42px;
  }
  .in-check { background: radial-gradient(circle, var(--danger) 0%, transparent 70%) !important; }
  .wrong-move { background-color: #ff4b2b !important; animation: shake 0.5s; }
  
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }

  .sidebar { width: 320px; display: flex; flex-direction: column; gap: 15px; }

  .panel {
    background: rgba(20, 20, 45, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 20px; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .elo-display { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon-gold); margin-bottom: 5px; }
  .strike-zone { color: var(--danger); font-size: 1.2rem; margin-bottom: 15px; letter-spacing: 5px; }
  
  .status-text { min-height: 5rem; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 0.95rem; line-height: 1.4; text-align: center; color: #ccc; flex-direction: column; gap: 8px;}

  button {
    padding: 14px; font-size: 13px; font-family: 'Orbitron', sans-serif; font-weight: bold;
    text-transform: uppercase; color: white; border: none; border-radius: 12px;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    width: 100%; margin-top: 10px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
  }
  button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 114, 255, 0.5); }
  button:active { transform: scale(0.95); }

  .btn-next { background: linear-gradient(45deg, #11998e, #38ef7d); }
  .btn-retry { background: linear-gradient(45deg, #cb2d3e, #ef473a); }
  .btn-exit { background: transparent; border: 1px solid #444; color: #888; margin-top: auto; }
  .btn-exit:hover { border-color: #fff; color: #fff; }

  #overlay, #promotionOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 10, 30, 0.95); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  
  #promotionOverlay { display: none; z-index: 2000; }

  .menu-card {
    width: 90%; max-width: 500px; padding: 40px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--neon-blue); border-radius: 30px;
    box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
  }
  
  .promotion-card {
    width: 90%; max-width: 400px; padding: 30px; text-align: center;
  }

  .promo-pieces {
    display: flex; justify-content: space-around; margin-top: 20px;
  }
  
  .promo-piece {
    font-size: 50px; cursor: pointer; padding: 10px; border-radius: 10px;
    background: rgba(255,255,255,0.1); border: 1px solid transparent;
    transition: 0.2s;
  }
  
  .promo-piece:hover {
    background: rgba(0, 210, 255, 0.3); border: 1px solid var(--neon-blue);
    transform: scale(1.1);
  }

  .custom-select {
    width: 100%; padding: 15px; background: #1a1a3a; border: 2px solid var(--neon-blue);
    border-radius: 12px; color: white; font-family: 'Orbitron', sans-serif;
    outline: none; margin: 20px 0; cursor: pointer;
  }

  .loading-container { display: none; margin: 20px 0; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid var(--neon-blue); border-radius: 50%;
    animation: spin 1s linear infinite; margin: 0 auto;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="overlay">
  <div class="menu-card">
    <h3 style="font-family: 'Orbitron'; color: var(--neon-blue);">CHESS PUZZLE</h3>
    <p style="font-size: 0.9rem; opacity: 0.7;">Engine v3.6 | Multi-Move Sequencing Active</p>
    
    <select id="scenarioType" class="custom-select">
      <option value="mate">TACTICS: CHECKMATE</option>
      <option value="rated">RATED SURVIVAL (ELO 100+)</option>
      <option value="fork">TACTICS: FORKS</option>
      <option value="pin">TACTICS: PINS</option>
      <option value="material">TACTICS: MATERIAL</option>
      <option value="mixed">TACTICS: RANDOM MIX</option>
      <option value="start">VS ENGINE (FREE PLAY)</option>
    </select>

    <div id="loading" class="loading-container">
      <div class="spinner"></div>
      <p id="loadingText" style="margin-top: 10px; font-size: 0.8rem; letter-spacing: 2px;">SYNCHRONIZING VECTORS...</p>
    </div>

    <button id="initBtn" onclick="startGame()">INITIALIZE PUZZLE</button>
  </div>
</div>

<!-- Promotion UI -->
<div id="promotionOverlay">
    <div class="menu-card promotion-card">
        <h3 style="font-family: 'Orbitron'; color: var(--neon-gold); margin-top:0;">SELECT PROTOCOL</h3>
        <p style="font-size: 0.9rem; opacity: 0.7;">Choose piece for promotion</p>
        <div class="promo-pieces">
            <div class="promo-piece piece-w" onclick="completePromotion('q')">♛</div>
            <div class="promo-piece piece-w" onclick="completePromotion('n')">♞</div>
            <div class="promo-piece piece-w" onclick="completePromotion('r')">♜</div>
            <div class="promo-piece piece-w" onclick="completePromotion('b')">♝</div>
        </div>
    </div>
</div>

<h2>♟️ CHESS PUZZLE ARENA</h2>

<div class="main-container">
  <div class="board-wrapper">
    <div id="chessboard"></div>
  </div>

  <div class="sidebar">
    <div class="panel" id="puzzlePanel">
      <div id="eloContainer" style="display:none">
        <div class="elo-display" id="userElo">Rating: 100</div>
        <div class="strike-zone" id="strikes"></div>
      </div>
      <div class="status-text" id="feedback">Establishing Uplink...</div>
      
      <button onclick="provideHint()" id="hintBtn">💡 Logical Hint / Move</button>
      <button class="btn-retry" onclick="handleRetry()" id="retryBtn" style="display:none">↺ Reset Position</button>
      <button class="btn-next" onclick="nextScenario()" id="nextBtn" style="display:none">Next Mission ➡</button>
    </div>
    <button class="btn-exit" onclick="exitToDashboard()">⬅ Exit Arena</button>
  </div>
</div>

<script>
function exitToDashboard() { 
    // Show the setup overlay instead of navigating via href (which throws an error in iframes/blob environments)
    document.getElementById("overlay").style.display = "flex";
    document.getElementById("initBtn").style.display = "block";
    document.getElementById("loading").style.display = "none";
    document.getElementById("chessboard").style.display = "none";
    document.getElementById("eloContainer").style.display = "none";
    document.getElementById("retryBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    feedback.innerHTML = "Establishing Uplink...";
    if(game) { game.reset(); }
}

    { id: "m54", fen: "5r2/pq4k1/1pp1Qn2/2bp1PB1/3R1R2/2P3P1/P6P/6K1 w - - 1 1", solution: ["g5f6", "f8f6", "f4g4", "g7h7", "e6g8", "h7h6", "g4h4"], goal: "Mate in 4", clue: "Akiba Rubinstein vs Rudolf Spielmann, 1908 | First move: Bishop" }
  ],
  fork: [

    {id:"f2", fen:"3q2k1/p4ppp/8/3N4/8/8/5PPP/3R2K1 w - - 0 1", solution:["d5e7"], goal:"Royal Fork Surprise", clue:"Check the king and win the Queen."}
  ],

    {id:"p2", fen:"4k3/8/8/8/1r6/8/1B6/1K6 w - - 0 1", solution:["b1c2"], goal:"The X-Ray Attack", clue:"Align your King and Bishop."}
  ],
  material: [
    {id:"mt1", fen:"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", solution:["d2d4"], goal:"Opening Advantage", clue:"Challenge the center immediately."},

const apiKey = ""; 
let game = null, currentPuzzle = null, selectedSquare = null;
let userElo = 100, strikes = 0, moveHistory = [], boardOrientation = 'white', isProcessing = false;
let hintState = 0; 
let playedIds = new Set();
let pendingPromotionMove = null;

const boardDiv = document.getElementById("chessboard"), feedback = document.getElementById("feedback");

const pieceMap = {
  'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
  'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
};

const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

async function callGemini(prompt) {
  if (!apiKey) throw new Error("MISSING_KEY");
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt + " Unique Seed: " + Math.random() }] }],
      systemInstruction: { parts: [{ text: "You are a Chess Grandmaster. Generate UNIQUE puzzles. Initial FEN must be legal. The solution MUST alternate [Player Move, AI Response, Player Move]. Output UCI notation (e.g. c4f7, c7b8n)." }] },
      generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
              type: "OBJECT",
              properties: {
                  fen: { type: "STRING" },
                  solution: { type: "ARRAY", items: { type: "STRING" } },
                  goal: { type: "STRING" },
                  clue: { type: "STRING" }
              },
              required: ["fen", "solution", "goal", "clue"]
          }
      }
    })
  });
  if (!response.ok) throw new Error("API_FAIL");
  const data = await response.json();
  return JSON.parse(data.candidates[0].content.parts[0].text);
}

async function startGame() {
  const type = document.getElementById("scenarioType").value;
  document.getElementById("initBtn").style.display = "none";
  document.getElementById("loading").style.display = "block";
  isProcessing = true;
  playedIds.clear(); 

  try {
    if (type === 'start') {
        game = new Chess(); currentPuzzle = null; boardOrientation = 'white';
        feedback.innerHTML = "Standard Mission Active. AI Engine ready.";
        isProcessing = false;
        document.getElementById("overlay").style.display = "none";
        boardDiv.style.display = "grid";
        renderBoard();
    } else {
        await loadNewPuzzle(type);
        document.getElementById("overlay").style.display = "none";
        boardDiv.style.display = "grid";
        if (type === 'rated') document.getElementById("eloContainer").style.display = "block";
        renderBoard();
    }
  } catch (e) {
    loadFallback(type);
    document.getElementById("overlay").style.display = "none";
    boardDiv.style.display = "grid";
    if (type === 'rated') document.getElementById("eloContainer").style.display = "block";
    renderBoard();
  }
}

function loadFallback(category) {
    const pool = category === 'mixed' ? [...localPuzzles.mate, ...localPuzzles.fork, ...localPuzzles.pin] : (localPuzzles[category] || localPuzzles.mate);
    let unplayed = pool.filter(p => !playedIds.has(p.id));
    if (unplayed.length === 0) { playedIds.clear(); unplayed = pool; }
    
    currentPuzzle = unplayed[Math.floor(Math.random() * unplayed.length)];
    playedIds.add(currentPuzzle.id);
    
    game = new Chess(currentPuzzle.fen);
    moveHistory = [];
    hintState = 0;
    boardOrientation = game.turn() === 'w' ? 'white' : 'black';
    feedback.innerHTML = `<span style="color:var(--neon-blue)">MISSION:</span> ${currentPuzzle.goal}`;
    document.getElementById("loading").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("retryBtn").style.display = "none";
    renderBoard();
    isProcessing = false; 
}

async function loadNewPuzzle(type) {
  isProcessing = true;
  feedback.innerText = "Scanning neural vectors...";
  const prompt = `Generate a fresh, unique ${type} puzzle for Elo ${userElo}. Side to move: ${userElo > 1200 ? 'Black' : 'White'}. Include multi-move sequence if possible.`;
  try {
    const data = await callGemini(prompt);
    currentPuzzle = data;
    game = new Chess(data.fen);
    moveHistory = [];
    hintState = 0;
    boardOrientation = game.turn() === 'w' ? 'white' : 'black';
    document.getElementById("retryBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    feedback.innerHTML = `<span style="color:var(--neon-blue)">GOAL:</span> ${data.goal}`;
    renderBoard();
    isProcessing = false;
  } catch(e) {
      loadFallback(type);
  }
}

function renderBoard() {
  boardDiv.innerHTML = "";
  const boardArr = game.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      let aR = boardOrientation === 'white' ? r : 7 - r;
      let aC = boardOrientation === 'white' ? c : 7 - c;
      const piece = boardArr[aR][aC];
      const code = String.fromCharCode(97 + aC) + (8 - aR);
      const sq = document.createElement("div");
      sq.className = `square ${(aR + aC) % 2 === 0 ? "white-sq" : "black-sq"}`;
      sq.dataset.square = code;
      
      if (c === 0) { const l = document.createElement("span"); l.className="coord rank-label"; l.innerText = 8-aR; sq.appendChild(l); }
      if (r === 7) { const l = document.createElement("span"); l.className="coord file-label"; l.innerText = String.fromCharCode(97+aC); sq.appendChild(l); }

      if (piece) {
        const p = document.createElement("span");
        p.className = piece.color === 'w' ? 'piece-w' : 'piece-b';
        p.textContent = pieceMap[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
        sq.appendChild(p);
      }
      sq.onclick = () => handleSquareClick(code);
      boardDiv.appendChild(sq);
    }
  }
  if (game.in_check()) highlightKing(game.turn());
}

function highlightKing(color) {
  const squares = Array.from(boardDiv.children);
  const b = game.board();
  for (let r=0; r<8; r++) for (let c=0; c<8; c++)
    if (b[r][c]?.type === 'k' && b[r][c]?.color === color) {
        const code = String.fromCharCode(97+c)+(8-r);
        const target = squares.find(s => s.dataset.square === code);
        if (target) target.classList.add("in-check");
    }
}

function checkPromotionIntent(from, to) {
    const piece = game.get(from);
    if (!piece || piece.type !== 'p') return false;
    const targetRank = to[1];
    if (targetRank !== '1' && targetRank !== '8') return false;
    
    // Verify it's a pseudo legal move that demands promotion
    const moves = game.moves({ verbose: true });
    return moves.some(m => m.from === from && m.to === to && m.promotion);
}

function handleSquareClick(code) {
  if (isProcessing) return;
  if (selectedSquare) {
    if (selectedSquare === code) { deselect(); return; }
    
    // Check if the move requires promotion selection
    if (checkPromotionIntent(selectedSquare, code)) {
        pendingPromotionMove = { from: selectedSquare, to: code };
        document.getElementById("promotionOverlay").style.display = "flex";
        
        // Update styling colors for pieces based on turn
        const isWhite = game.turn() === 'w';
        document.querySelectorAll('.promo-piece').forEach(el => {
            el.className = `promo-piece ${isWhite ? 'piece-w' : 'piece-b'}`;
        });
        return;
    }
    
    executeMove({ from: selectedSquare, to: code });
  } else {
    const p = game.get(code);
    if (p?.color === game.turn()) selectSquare(code);
  }
}

function completePromotion(pieceType) {
    document.getElementById("promotionOverlay").style.display = "none";
    if (pendingPromotionMove) {
        pendingPromotionMove.promotion = pieceType;
        executeMove(pendingPromotionMove);
        pendingPromotionMove = null;
    }
}

function executeMove(moveObj) {
  const m = game.move(moveObj);
  if (m) {
      renderBoard();
      let moveString = moveObj.from + moveObj.to + (moveObj.promotion || '');
      if (currentPuzzle) validatePuzzleMove(moveString);
      else handleEngineTurn();
      deselect();
  } else {
      const p = game.get(moveObj.to);
      if (p?.color === game.turn()) { deselect(); selectSquare(moveObj.to); } else deselect();
  }
}

function selectSquare(code) {
  selectedSquare = code;
  const target = Array.from(boardDiv.children).find(s => s.dataset.square === code);
  if (target) target.classList.add("selected");
  game.moves({ square: code, verbose: true }).forEach(m => {
    const dest = Array.from(boardDiv.children).find(s => s.dataset.square === m.to);
    if (dest) { dest.classList.add("highlight"); if (game.get(m.to)) dest.classList.add("capture"); }
  });
}

function deselect() {
  selectedSquare = null;
  Array.from(boardDiv.children).forEach(s => s.classList.remove("selected", "highlight", "capture"));
}

function validatePuzzleMove(userMoveString) {
  const expectedMove = currentPuzzle.solution[moveHistory.length];
  
  // Accept if it exactly matches the expected UCI string OR if it forces mate directly
  if (userMoveString === expectedMove || game.in_checkmate()) {
    moveHistory.push(userMoveString);
    hintState = 0;
    
    // Check if puzzle is fully completed
    if (game.in_checkmate() || moveHistory.length === currentPuzzle.solution.length) {
        handleSuccess();
    } else {
        // Trigger Opponent's Forced Response
        isProcessing = true;
        feedback.innerHTML = "<span style='color:var(--success)'>Move accepted.</span> Opponent responding...";
        
        setTimeout(() => {
            const aiMoveString = currentPuzzle.solution[moveHistory.length];
            if (aiMoveString) {
                let aiMoveObj = { from: aiMoveString.substring(0,2), to: aiMoveString.substring(2,4) };
                if (aiMoveString.length === 5) aiMoveObj.promotion = aiMoveString[4];
                
                game.move(aiMoveObj);
                moveHistory.push(aiMoveString);
                renderBoard();
                
                feedback.innerHTML = `<span>Opponent played <b>${aiMoveString}</b>.</span> Your turn.`;
                
                // If the AI move happens to end the solution sequence
                if(moveHistory.length === currentPuzzle.solution.length) {
                    handleSuccess();
                }
            }
            isProcessing = false;
        }, 700); // Small delay for realism
    }
  } else { handleFail(userMoveString.substring(2,4)); }
}

function handleEngineTurn() {
    if (game.game_over()) return;
    isProcessing = true;
    feedback.innerText = "Engine thinking...";
    setTimeout(() => {
        const best = getBestMove();
        if (best) game.move(best);
        renderBoard();
        isProcessing = false;
        if (game.in_checkmate()) feedback.innerHTML = "<span class='fail'>CHECKMATE. AI Victory.</span>";
    }, 500);
}

function provideHint() {
    if (!currentPuzzle) return;
    const isRated = document.getElementById("scenarioType").value === 'rated';
    const currentSol = currentPuzzle.solution[moveHistory.length];
    
    if (isRated) {
        feedback.innerHTML = `<span style='color:var(--neon-blue)'>ADVISORY:</span> ${currentPuzzle.clue}`;
    } else {
        if (hintState === 0) {
            feedback.innerHTML = `<span style='color:var(--neon-blue)'>ADVISORY:</span> ${currentPuzzle.clue}`;
            hintState = 1;
        } else if (currentSol) {
            let promoText = currentSol.length === 5 ? ` (Promote to ${currentSol[4].toUpperCase()})` : '';
            feedback.innerHTML = `<span style='color:var(--neon-gold)'>MOVE REVEALED:</span> Play <b>${currentSol.substring(0,2)}</b> to <b>${currentSol.substring(2,4)}</b>${promoText}.`;
        }
    }
}

function handleSuccess() {
  feedback.innerHTML = `<span class='success' style='font-family:Orbitron'> MISSION SUCCESSFUL!</span><br/>Objective Neutralized.`;
  if (document.getElementById("scenarioType").value === 'rated') { userElo += 25; updateEloUI(); }
  document.getElementById("nextBtn").style.display = "block";
  isProcessing = false;
}

function handleFail(sq) {
  isProcessing = true;
  feedback.innerHTML = `<span class='fail'>CRITICAL ERROR!</span><br/>Position reset.`;
  const target = Array.from(boardDiv.children).find(s => s.dataset.square === sq);
  if (target) target.classList.add("wrong-move");
  
  if (document.getElementById("scenarioType").value === 'rated') {
      strikes++;
      userElo = Math.max(100, userElo - 20);
      updateEloUI();
      if (strikes >= 3) {
          document.getElementById("retryBtn").innerText = "RESTART ARENA (ELO RESET)";
          document.getElementById("retryBtn").style.display = "block";
          return;
      }
  }
  document.getElementById("retryBtn").style.display = "block";
  
  // Undo the wrong move
  setTimeout(() => { 
      if(game.history().length > 0) game.undo(); 
      renderBoard(); 
      isProcessing = false; 
      feedback.innerHTML = "Awaiting your move...";
  }, 1000);
}

function updateEloUI() {
  document.getElementById("userElo").innerText = `Rating: ${userElo}`;
  let str = ""; for (let i=0; i<strikes; i++) str += "❌ ";
  document.getElementById("strikes").innerText = str;
}

function handleRetry() {
  if (document.getElementById("scenarioType").value === 'rated' && strikes >= 3) {
      userElo = 100; strikes = 0;
      updateEloUI();
      document.getElementById("retryBtn").innerText = "↺ Reset Position";
      nextScenario();
  } else {
      // Complete reset to initial FEN state based on puzzle
      game = new Chess(currentPuzzle.fen);
      
      // If AI goes first in the puzzle (rare, but good for robust code), we'd handle it here
      moveHistory = [];
      renderBoard();
      feedback.innerHTML = `<span style="color:var(--neon-blue)">MISSION:</span> ${currentPuzzle.goal}`;
      document.getElementById("retryBtn").style.display = "none";
      isProcessing = false;
  }
}

async function nextScenario() { 
    const type = document.getElementById("scenarioType").value;
    isProcessing = true;
    document.getElementById("nextBtn").style.display = "none";
    try {
        if(apiKey) await loadNewPuzzle(type);
        else loadFallback(type);
    } catch(e) { loadFallback(type); }
}

function getBestMove() {
  let moves = game.moves(); if (moves.length === 0) return null;
  let bestMove = null, bestValue = game.turn() === 'w' ? -Infinity : Infinity;
  for (let m of moves) {
    game.move(m); 
    let val = evaluateBoard(); game.undo();
    if (game.turn() === 'w' ? (val > bestValue) : (val < bestValue)) { bestValue = val; bestMove = m; }
  }
  return bestMove;
}
function evaluateBoard() {
    let eval = 0;
    game.board().forEach(row => row.forEach(p => { if(p) eval += (p.color === 'w' ? pieceValues[p.type] : -pieceValues[p.type]); }));
    return eval;
}
