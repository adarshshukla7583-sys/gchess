<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Chess Online - Multiplayer</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
  :root {
    --board-size: min(90vw, 480px);
    --square-size: calc(var(--board-size) / 8);
    --primary-blue: #3b82f6;
    --danger-red: #ff4d4d;
  }

  body {
    background: radial-gradient(circle at center, #1a1a2e 0%, #0f0c29 100%);
    color: white; font-family: 'Roboto', sans-serif; margin: 0;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px;
    box-sizing: border-box; overflow-x: hidden;
  }
  
  .game-container { 
    display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; justify-content: center; width: 100%; 
    max-width: 1200px;
  }
  
  .board-container {
    position: relative;
    width: var(--board-size);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #chessboard {
    width: 100%; height: var(--board-size); display: grid; grid-template-columns: repeat(8, 1fr);
    border: 8px solid #2c3e50; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    background: #2c3e50; position: relative;
  }
  
  .square {
    width: var(--square-size); height: var(--square-size); 
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--square-size) * 0.75); cursor: pointer; user-select: none; position: relative;
  }
  
  .white { background-color: #ffffff; }
  .black { background-color: var(--primary-blue); }
  .piece-w { color: #ffffff; filter: drop-shadow(0 0 2px #000); }
  .piece-b { color: #000000; filter: drop-shadow(0 0 1px #fff); }
  
  .selected { background-color: #fde047 !important; }

  /* Highlight King in Check */
  .in-check {
    background: radial-gradient(circle, var(--danger-red) 35%, transparent 85%) !important;
    animation: pulse-red 1.5s infinite;
  }
  @keyframes pulse-red { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
  
  /* Move Hint Dot */
  .move-hint::after {
    content: ''; width: 25%; height: 25%; background: rgba(0, 0, 0, 0.15); border-radius: 50%; position: absolute;
  }
  .move-hint.capture-hint::after {
    width: 80%; height: 80%; background: transparent; border: 4px solid rgba(0, 0, 0, 0.1); border-radius: 50%;
  }

  .player-label {
    width: 100%; padding: 10px 15px; background: rgba(255, 255, 255, 0.1); border-radius: 8px;
    font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.1); box-sizing: border-box; min-height: 45px;
  }

  /* Search/Reconnection Overlay */
  #loadingOverlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 15, 35, 0.95); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; border-radius: 4px; border: 2px solid var(--primary-blue);
    transition: opacity 0.4s ease; text-align: center; padding: 20px; box-sizing: border-box;
  }

  .spinner {
    width: 45px; height: 45px; border: 5px solid rgba(255,255,255,0.1);
    border-top: 5px solid var(--primary-blue); border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 15px;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .sidebar {
    width: 100%; max-width: 320px; background: rgba(255,255,255,0.08); padding: 15px;
    border-radius: 15px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 10px;
  }
  
  #chatBox { height: 140px; background: rgba(0,0,0,0.3); overflow-y: auto; padding: 10px; border-radius: 8px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); }
  input[type="text"] { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1a1a2e; color: white; width: 100%; box-sizing: border-box; }
  
  .status-bar { background: #10b981; padding: 10px 20px; border-radius: 50px; margin-bottom: 10px; font-weight: bold; font-size: 0.9rem; width: 100%; max-width: 480px; text-align: center; }

  #messageModal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 85%; max-width: 350px; background: rgba(15, 15, 35, 0.98);
    padding: 30px; border-radius: 20px; border: 2px solid var(--primary-blue); text-align: center;
    z-index: 1000; box-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
  }
  
  .modal-btn { padding: 10px 20px; background: var(--primary-blue); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }

  #timerValue { font-size: 1.8rem; color: #fde047; font-weight: 700; margin-top: 10px; }
</style>
</head>
<body>

  <div class="status-bar" id="status">Arena Connected</div>

  <div id="messageModal">
    <h2 id="msgTitle">Checkmate!</h2>
    <p id="msgSubtitle">White Wins</p>
    <button class="modal-btn" onclick="location.reload()">New Game</button>
    <button class="modal-btn" style="background:#444" onclick="window.location.href='/dashboard'">Exit</button>
  </div>

  <div class="game-container">
    <div class="board-container">
        <div class="player-label" id="topPlayer">Opponent: Waiting...</div>
        
        <div style="position: relative; width: 100%; height: var(--board-size);">
            <div id="loadingOverlay">
                <div class="spinner"></div>
                <p id="loadingText">Searching for player...</p>
                <div id="timerValue"></div>
            </div>
            <div id="chessboard"></div>
        </div>

        <div class="player-label" id="bottomPlayer">You: Waiting...</div>
    </div>

    <div class="sidebar">
      <div style="display:flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0; font-size: 1rem;">Room: <span id="roomDisplay" style="color:var(--primary-blue);">...</span></h3>
        <p id="turnDisplay" style="margin:0; font-weight:700; font-size: 0.9rem;">Turn: White</p>
      </div>
      <p id="playerRole" style="color: #fde047; font-size: 0.8rem; margin: 0;">Joining as...</p>
      <div id="chatBox"></div>
      <input type="text" id="chatInput" placeholder="Send a message...">
      <button style="padding: 12px; background: #ef4444; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="window.location.href='/dashboard'">Exit Match</button>
    </div>
  </div>

<script>
  const socket = io();
  let game = new Chess();
  const boardEl = document.getElementById('chessboard');
  const chatBox = document.getElementById('chatBox');
  const chatInput = document.getElementById('chatInput');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const timerValue = document.getElementById('timerValue');
  const roomName = "Global_Arena"; 
  
  let selectedSquare = null;
  let myColor = null; 
  let playerNames = { w: "Waiting...", b: "Waiting..." };
  let reconnectInterval = null;
  let legalMoves = []; 

  const pieces = {
    'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
    'P': '♟', 'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚'
  };

  socket.on('connect', () => {
    socket.emit('join_game', { room: roomName });
  });

  socket.on('assign_color', (data) => {
    myColor = data.color;
    document.getElementById('playerRole').innerText = myColor === 'w' ? "Playing as WHITE" : (myColor === 'b' ? "Playing as BLACK" : "SPECTATING");
    updatePlayerDisplays();
    drawBoard();
  });

  socket.on('sync_state', (data) => {
    game.load(data.fen);
    drawBoard();
    updateStatus();
  });

  socket.on('game_ready', (data) => {
    if (reconnectInterval) { clearInterval(reconnectInterval); reconnectInterval = null; timerValue.innerText = ""; }

    if (data.status === 'start') {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => { if (loadingOverlay.style.opacity === '0') loadingOverlay.style.display = 'none'; }, 400);
    } else if (data.status === 'reconnecting') {
        loadingOverlay.style.display = 'flex';
        loadingOverlay.style.opacity = '1';
        loadingText.innerHTML = `<span style="color:#ef4444; font-weight:bold;">${data.user} EXITED</span><br>Waiting for reconnection...`;
        let timeLeft = 30;
        timerValue.innerText = timeLeft + "s";
        reconnectInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) timerValue.innerText = timeLeft + "s";
            else clearInterval(reconnectInterval);
        }, 1000);
    } else if (data.status === 'abandoned') {
        loadingOverlay.style.display = 'none';
        document.getElementById('msgTitle').innerText = "Match Ended";
        document.getElementById('msgSubtitle').innerText = "Opponent failed to reconnect.";
        document.getElementById('messageModal').style.display = "block";
    } else {
        loadingOverlay.style.display = 'flex';
        loadingOverlay.style.opacity = '1';
        loadingText.innerText = "Searching for player...";
    }
  });

  socket.on('receive_move', (data) => {
    game.move(data.move);
    drawBoard();
    updateStatus();
  });

  socket.on('new_chat', (data) => {
    const msg = document.createElement('div');
    msg.style.marginBottom = '5px';
    msg.innerHTML = `<b style="color:var(--primary-blue)">${data.user}:</b> ${data.msg}`;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  socket.on('player_joined', (data) => {
    if (data.color === 'w') playerNames.w = data.username;
    if (data.color === 'b') playerNames.b = data.username;
    updatePlayerDisplays();
  });

  function updatePlayerDisplays() {
    const top = document.getElementById('topPlayer');
    const bottom = document.getElementById('bottomPlayer');
    if (myColor === 'b') {
        top.innerHTML = `<span>White</span> <b>${playerNames.w}</b>`;
        bottom.innerHTML = `<span>Black (You)</span> <b>${playerNames.b}</b>`;
    } else {
        top.innerHTML = `<span>Black</span> <b>${playerNames.b}</b>`;
        bottom.innerHTML = `<span>White (You)</span> <b>${playerNames.w}</b>`;
    }
  }

  function drawBoard() {
    boardEl.innerHTML = '';
    const board = game.board();
    const isCheck = game.in_check();
    const turn = game.turn();
    
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        // FLIP LOGIC: If I am black, show rank 1 at row 0.
        const visualRow = myColor === 'b' ? 7 - r : r;
        const visualCol = myColor === 'b' ? 7 - c : c;
        
        const square = document.createElement('div');
        square.className = `square ${(visualRow + visualCol) % 2 === 0 ? 'white' : 'black'}`;
        const coord = String.fromCharCode(97 + visualCol) + (8 - visualRow);
        square.dataset.coord = coord;

        if (selectedSquare === coord) square.classList.add('selected');
        
        // Move hints
        const hintMove = legalMoves.find(m => m.to === coord);
        if (hintMove) {
            square.classList.add('move-hint');
            if (game.get(coord)) square.classList.add('capture-hint');
        }

        const piece = board[visualRow][visualCol];
        // King Check highlight
        if (isCheck && piece && piece.type === 'k' && piece.color === turn) square.classList.add('in-check');

        if (piece) {
          const span = document.createElement('span');
          span.className = piece.color === 'w' ? 'piece-w' : 'piece-b';
          span.innerText = pieces[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
          square.appendChild(span);
        }
        square.onclick = () => handleSquareClick(coord);
        boardEl.appendChild(square);
      }
    }
  }

  function handleSquareClick(coord) {
    if (myColor === 'observer' || game.turn() !== myColor) return;
    if (selectedSquare) {
      const move = game.move({ from: selectedSquare, to: coord, promotion: 'q' });
      if (move) {
        socket.emit('send_move', { move: move, room: roomName, fen: game.fen() });
        selectedSquare = null; legalMoves = [];
        drawBoard(); updateStatus();
      } else {
        const p = game.get(coord);
        if (p && p.color === myColor) {
          selectedSquare = coord; legalMoves = game.moves({ square: coord, verbose: true });
          drawBoard();
        } else { selectedSquare = null; legalMoves = []; drawBoard(); }
      }
    } else {
      const p = game.get(coord);
      if (p && p.color === myColor) {
        selectedSquare = coord; legalMoves = game.moves({ square: coord, verbose: true });
        drawBoard();
      }
    }
  }

  function updateStatus() {
    document.getElementById('turnDisplay').innerText = `Turn: ${game.turn() === 'w' ? 'White' : 'Black'}`;
    if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'Black' : 'White';
        document.getElementById('msgTitle').innerText = "Checkmate!";
        document.getElementById('msgSubtitle').innerText = winner + " Wins";
        document.getElementById('messageModal').style.display = "block";
    }
  }

  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && chatInput.value.trim() !== "") {
      socket.emit('chat_message', { msg: chatInput.value, room: roomName });
      chatInput.value = "";
    }
  });

  drawBoard();
</script>
</body>
</html>
